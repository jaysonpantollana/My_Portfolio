            - generic [ref=f4e45]:
              - paragraph [ref=f4e46]: ABOUT ME
              - generic [ref=f4e47]:
                - paragraph [ref=f4e48]: I am a Mechanical Engineering student at MSU-IIT blending technical rigor with a disciplined work ethic shaped by years of competitive tennis. As a founder of a local startup, I lead the development of platforms such as DailyDrop a food delivery app and Khubo a rental property listing app. Now, it is in progress, and concurrently serving as the SPODA Head for JPSME.
                - paragraph [ref=f4e49]: My journey is deeply rooted in a commitment to continuous self-improvement and an unwavering foundation of faith, both of which serve as the internal compass for everything I build. I believe that true innovation is not just about technical mastery, but about ensuring that my work in engineering research and software development translates into a meaningful, lasting contribution to my community.
            - generic [ref=f4e50]:
              - paragraph [ref=f4e51]: ACKNOWLEDGEMENT
              - generic [ref=f4e52]:
                - paragraph [ref=f4e53]: Above all, I offer my most profound gratitude to the Almighty God, the author of my life and the source of every blessing I have received. As I reflect on my journey through research, academics, sports, and the building of my startups, I am humbled by the realization that while these achievements are the result of hard work and dedication, it is His hand that has guided every step.
                - paragraph [ref=f4e54]: I thank Him for the blessing of life itself, for the air I breathe, and for the opportunity to live out the purpose He has set before me. Beyond the technical wins and academic honors, I am most grateful for how He has guided me and improved me as a man. He has taken my ambitions and refined them, teaching me to walk in His ways and molding my character through both success and struggle.
                - paragraph [ref=f4e55]: In the long nights spent coding or studying engineering, He was my clarity. In the heat of competition on the court, He was my discipline. In the uncertainty of starting a business, He was my steady foundation. I am thankful for the grace to live the life He gave me and for the constant guidance that pushes me to grow into a better version of myself every day. Every milestone reached is not a testament to my own power but to His unending favor. I dedicate all my work and my very life back to Him, acknowledging that I am who I am today only by His divine grace. To God be all the glory.
