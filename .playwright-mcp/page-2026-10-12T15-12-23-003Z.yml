            - generic [ref=e34]: • PRE-SCHOOL
          - generic [ref=e36]:
            - paragraph [ref=e37]: beginning with the shaky courage of let-go hands at the classroom door and the gradual discovery of a world beyond home. It is a formative chapter defined by the sticky remains of craft glue, the focused silence of a coloring session, and the sudden, joyful chaos of the playground where the first foundations of friendship are built over shared toys. Through a rhythmic cycle of circle time songs, naptime stories, and the proud display of finger-painted masterpieces, a child transforms from a hesitant observer into a curious explorer. By the time the final bell rings on that first year, the journey has successfully traded separation anxiety for a newfound confidence, turning a room full of strangers into a community and a daunting school building into a second home.
