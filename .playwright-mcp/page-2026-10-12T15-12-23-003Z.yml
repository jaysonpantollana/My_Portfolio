            - generic [ref=e56]: • ELEMENTARY
          - generic [ref=e58]:
            - paragraph [ref=e59]: Elementary school began with a very focused start, where from Grade 1 to 3, I was the typical "good student" who cared mostly about grades and lessons. However, that changed in Grade 4 when the fun of childhood games took over, and I became a bit of a slacker. Instead of following the teacher's instructions, I started skipping classes to play Takyan, Dampa, and Teks with my friends, or heading to the computer shop to get lost in video games. Everything shifted again in Grade 5 when I discovered tennis. I decided to take the sport seriously, which actually pushed me to start caring about my academics again, too. But because my passion for the court was so strong, I often prioritized my training over everything else. My journey through those final years of elementary was a constant balancing act I was a dedicated student-athlete who would sometimes skip homework or school projects just to squeeze in more time for a tennis match.
